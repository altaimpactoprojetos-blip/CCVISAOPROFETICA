name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Wrangler discovers the account from the token when it can reach exactly
      # one account, so the ID is only forwarded when it looks like a real one.
      - name: Resolve Cloudflare account
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ "$ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
            echo "Using the configured Cloudflare account ID."
          else
            echo "CLOUDFLARE_ACCOUNT_ID secret is missing or invalid; letting Wrangler pick the token's account."
          fi

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Application secrets live in the GitHub repository (or "production"
      # environment) secrets and are pushed to the Worker on every deploy. Empty values are skipped so nothing
      # already configured in Cloudflare is erased.
      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          ADMIN_SETUP_TOKEN_HASH: ${{ secrets.ADMIN_SETUP_TOKEN_HASH }}
          ADMIN_SETUP_EXPIRES_AT: ${{ secrets.ADMIN_SETUP_EXPIRES_AT }}
        run: |
          node --input-type=module - <<'NODE' > "$RUNNER_TEMP/secrets.json"
          const names = ["SUPABASE_URL", "SUPABASE_SECRET_KEY", "SUPABASE_STORAGE_BUCKET", "ADMIN_SETUP_TOKEN_HASH", "ADMIN_SETUP_EXPIRES_AT"];
          const secrets = Object.fromEntries(names.filter(name => process.env[name]).map(name => [name, process.env[name]]));
          console.log(JSON.stringify(secrets));
          NODE
          if [ "$(cat "$RUNNER_TEMP/secrets.json")" = "{}" ]; then
            echo "No application secrets configured in GitHub; skipping."
          else
            npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          fi
          rm -f "$RUNNER_TEMP/secrets.json"
